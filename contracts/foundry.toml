[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 1_000
seed = "0xb1ee"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
# Etherscan V2: one key works for every supported chain, Amoy included.
polygon_amoy = { key = "${ETHERSCAN_API_KEY}", chain = 80002 }

[lint]
# Time windows are days long; the few seconds a block producer can shift block.timestamp are irrelevant.
exclude_lints = ["block-timestamp"]
