name: app

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "content/**", "test/**", "scripts/*.*", "*.json", "*.ts", "*.mjs", "scripts/satellite/**", "contracts/src/**", "package-lock.json", ".github/workflows/app.yml"]
  pull_request:
    paths: ["src/**", "public/**", "content/**", "test/**", "scripts/*.*", "*.json", "*.ts", "*.mjs", "scripts/satellite/**", "contracts/src/**", "package-lock.json", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production dependencies audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CHAIN_ID: "80002"
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
