name: contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned dependencies
        run: make deps
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test (CI profile, deeper fuzzing)
        run: FOUNDRY_PROFILE=ci forge test -vv
      - name: Gas snapshot
        run: forge snapshot --check --tolerance 3 --no-match-contract InvariantsTest

  slither:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned dependencies
        run: make deps
        working-directory: contracts
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium
